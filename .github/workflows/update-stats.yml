name: Update README stats

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run generate
        env:
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_USERNAME: sontixyou

      - name: Create Pull Request if changed
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.GH_STATS_TOKEN }}
          commit-message: "chore: refresh stats SVGs"
          title: "chore: refresh stats SVGs"
          body: |
            Automated update of README stats SVGs.
          branch: chore/update-stats
          delete-branch: true
          add-paths: |
            assets/stats.svg
            assets/top-langs.svg
